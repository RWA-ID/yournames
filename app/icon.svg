<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Favicon — Dark Ledger mark: ink tile, paper "y" glyph (drawn as a path so
    it renders identically everywhere, no font dependency), mint live-dot.
  -->
  <rect width="64" height="64" rx="14" fill="#131318"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>
  <!-- "y": two strokes — right arm runs through to the descender, left arm meets it. -->
  <path d="M20 17 L29.5 38" stroke="#f4f3ef" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M43 17 L31.5 43.5 Q28.5 50 22.5 49" stroke="#f4f3ef" stroke-width="8.5" stroke-linecap="round" fill="none"/>
  <circle cx="47" cy="47" r="5.5" fill="#34d399"/>
</svg>
